  <path d="M 22.5 16 L 28 12.5 L 32 9" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 17 17.5 L 10 18 L 6.5 21.5" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 23 17.5 L 30 18 L 33.5 21.5" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 17.5 19 L 11 23 L 8.5 29.5" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 22.5 19 L 29 23 L 31.5 29.5" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

