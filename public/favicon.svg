  <path d="M 18.5 7.5 L 17 5.8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 21.5 7.5 L 23 5.8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

