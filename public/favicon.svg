  <path d="M 16.2 27.5 Q 20 29.2 23.8 27.5" stroke="#4F46E5" stroke-width="1.1" stroke-linecap="round" fill="none" />
  <path d="M 16.8 30.5 Q 20 32.2 23.2 30.5" stroke="#4F46E5" stroke-width="1.1" stroke-linecap="round" fill="none" />
